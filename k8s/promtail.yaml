# 각 노드의 컨테이너 로그를 수집해 Loki로 보내는 promtail
# 노드마다 하나씩 떠야 하므로 DaemonSet. 노드의 로그 디렉토리를 읽어야 하므로
# pod/노드 메타데이터 조회 권한(RBAC)과 hostPath 마운트가 필요함
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  # kubernetes_sd_configs로 pod를 찾아 namespace/pod/app 등의 라벨을 붙이기 위해 필요한 최소 권한
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - pods
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # kind는 containerd를 쓰므로 로그가 CRI 포맷(타임스탬프+스트림+메시지)으로 남음
          # 여기서 원본 로그 메시지(우리 서버가 찍은 한 줄 JSON)만 뽑아냄
          - cri: {}
        relabel_configs:
          # fd/session_id처럼 값이 무한히 늘어나는 필드는 라벨로 두지 않고 로그 본문에만 남겨서
          # (server/log.c가 그렇게 찍음) Loki 스트림이 폭발하지 않도록 함. 라벨은 저카디널리티만 사용
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.4
          args:
            - -config.file=/etc/promtail/promtail.yaml
          # promtail은 kubernetes_sd_configs(role: pod) 사용 시 "자기 노드의 pod만 본다"는
          # field selector(spec.nodeName=$HOSTNAME)를 자동으로 겁니다. 컨테이너의 기본 HOSTNAME은
          # pod 이름이라 노드 이름과 다르므로, downward API로 실제 노드 이름을 덮어써야 대상이 검색됨
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}
