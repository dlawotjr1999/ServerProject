# Redis: 3단계(pub/sub 스케일아웃)의 클러스터 전역 매치메이킹/메시지 전파 저장소.
#
# 데이터 볼륨은 의도적으로 emptyDir이다(PVC 아님) - REDESIGN.md §9 "머지 이후 후속 조치" 참고.
# chat-server pod이 비정상 종료(SIGKILL/OOM/노드 유실)되면 room_leave()를 못 거치므로 Redis 쪽
# room:{id}:count가 영구히 orphan될 수 있는데, PVC를 쓰면 Redis 자체가 재시작해도 이 orphan
# 상태가 지워지지 않고 무기한 누적된다. emptyDir이면 Redis pod이 재시작할 때마다(드물지만 발생함 -
# 롤링 업데이트, 리소스 압박에 의한 재스케줄 등) 전체 상태가 같이 리셋되므로 orphan이 무기한
# 쌓이는 건 막지만, 그 대신 재시작 시점에 room_next_id/room_freelist/global_session_seq를 포함한
# *모든* 상태가 초기화된다는 트레이드오프를 진 것이다:
#   - room_next_id가 0으로 리셋되는데, 그 순간 아직 살아있는 chat-server pod들은 예전 room_id를
#     가리키는 로컬 rooms[] 상태를 그대로 들고 있다. 리셋 이후 매치메이킹된 새 클라이언트가 우연히
#     그 재사용된 room_id를 받으면, 무관한 유저들이 서로 다른 pod의 같은 로컬 슬롯에서 조용히
#     섞일 수 있다(orphan 카운트보다 조용하고 나쁜 실패 모드).
#   - global_session_seq도 0으로 리셋된다. 재시작 시점에 아직 살아있던 세션들이 리셋 전에 이미
#     발급받은 global_id를 그대로 들고 있는 채로, 리셋 이후 발급되는 새 global_id와 우연히 겹치면
#     §9에서 고쳤던 cross-pod 자기 제외 버그(session_id 버전)가 global_id 버전으로 재발할 수 있다.
# 두 위험 모두 "Redis pod이 실제로 재시작하는 그 순간"에만 열리는 좁은 창이고, orphan 무기한 누적
# 보다는 낫다고 판단해 선택했지만 제로는 아니다 - 제대로 없애려면 TTL/하트비트 기반으로 "어느 pod이
# 어떤 좌석을 갖고 있는지"를 추적해 죽은 pod의 좌석만 골라 회수하는 별도 메커니즘이 필요하다(아직
# 구현 안 함).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
